<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page history</title>
<meta name="robots" content="noindex">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="design-system/tokens.css">
<style>
/* Page history viewer. Draft tooling, tokens only. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface-sunken); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.vh-bar { background: var(--surface); border-bottom: 1px solid var(--line); padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-3); }
.vh-row { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.vh-title { font: 300 20px/26px var(--font-sans); margin: 0; }
.vh-title a { color: inherit; text-decoration: none; }
.vh-ctl { display: flex; gap: var(--space-2); align-items: center; font: 400 12px/18px var(--font-mono); color: var(--ink-muted); }
.vh-ctl select, .vh-btn { font: 400 13px/18px var(--font-mono); color: var(--ink); background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 6px 10px; min-height: 36px; }
.vh-btn { cursor: pointer; }
.vh-btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.vh-sp { flex: 1; }
.vh-link { font: 400 12px/18px var(--font-mono); color: var(--flow); }
.vh-tl { display: flex; gap: 0; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.vh-v { flex: 1 0 128px; text-align: left; cursor: pointer; background: none; border: 0; border-top: 3px solid var(--line); padding: var(--space-2) var(--space-3) var(--space-1) 0; color: var(--ink-muted); font: inherit; }
.vh-v b { display: block; font: 400 13px/18px var(--font-sans); color: var(--ink); }
.vh-v small { font: 400 11px/16px var(--font-mono); }
.vh-v:hover { border-top-color: var(--line-strong); }
.vh-v[aria-current="true"] { border-top-color: var(--flow); }
.vh-v[aria-current="true"] b { font-weight: 500; }
.vh-v.is-b { border-top-color: var(--ink); }
.vh-note { font: 400 13px/20px var(--font-sans); color: var(--ink-muted); margin: 0; }
.vh-note code { font: 400 12px/18px var(--font-mono); color: var(--ink); }
.vh-stage { flex: 1; display: flex; gap: var(--space-2); padding: var(--space-2); min-height: 0; justify-content: center; }
.vh-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; max-width: 100%; }
.vh-pane > span { font: 400 11px/16px var(--font-mono); color: var(--ink-muted); padding: 0 0 var(--space-1); }
.vh-pane iframe { flex: 1; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); }
.is-phone .vh-pane { flex: 0 1 392px; }
.vh-keys { font: 400 11px/16px var(--font-mono); color: var(--ink-muted); }
@media (max-width: 760px) {
 .vh-keys, .vh-cmp { display: none; }
 .vh-stage { padding: 0; }
 .vh-pane iframe { border-radius: 0; border-width: 1px 0 0; }
}
</style>
</head>
<body>
<header class="vh-bar">
 <div class="vh-row">
  <h1 class="vh-title"><a href="index.html">Aquemi</a> · page history</h1>
  <label class="vh-ctl">Page <select id="vpage"></select></label>
  <span class="vh-ctl" role="group" aria-label="Width">
   <button class="vh-btn" id="vdesk" aria-pressed="true">Desktop</button><button class="vh-btn" id="vphone" aria-pressed="false">Phone</button>
  </span>
  <button class="vh-btn vh-cmp" id="vcmp" aria-pressed="false" title="Show the chosen version next to another one">Compare</button>
  <span class="vh-sp"></span>
  <span class="vh-keys">← → flip versions</span>
  <a class="vh-link" id="vopen" href="index.html" target="_blank" rel="noopener">Open this version ↗</a>
 </div>
 <nav class="vh-tl" id="vtl" aria-label="Checkpoints"></nav>
 <p class="vh-note" id="vnote"></p>
</header>
<main class="vh-stage" id="vstage">
 <div class="vh-pane"><span id="vlabA"></span><iframe id="vfa" title="Selected version"></iframe></div>
 <div class="vh-pane" id="vpb" hidden><span id="vlabB"></span><iframe id="vfb" title="Compared version"></iframe></div>
</main>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var V=[],S={page:'home',v:'now',b:null,w:'desk'},PAGES=[];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ver(id){for(var i=0;i<V.length;i++)if(V[i].id===id)return V[i];return V[V.length-1]}
function idx(id){for(var i=0;i<V.length;i++)if(V[i].id===id)return i;return V.length-1}
function when(d){var t=new Date(d);return t.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+t.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function readHash(){location.hash.slice(1).split('&').forEach(function(kv){var p=kv.split('=');if(p[0]&&p[1]!==undefined)S[p[0]]=decodeURIComponent(p[1])});if(S.b==='')S.b=null}
function writeHash(){var h='page='+S.page+'&v='+S.v+(S.b?'&b='+S.b:'')+(S.w==='phone'?'&w=phone':'');try{history.replaceState(null,'','#'+h)}catch(x){}}

// The frame's own draft bar is hidden: this bar does its job.
function tidy(f){try{var d=f.contentDocument;if(!d||d.getElementById('vh-tidy'))return;var s=d.createElement('style');s.id='vh-tidy';s.textContent='.draftbar{display:none!important}';(d.head||d.documentElement).appendChild(s)}catch(x){}}
function scrollRatio(f){try{var w=f.contentWindow,d=w.document.documentElement;var max=d.scrollHeight-w.innerHeight;return max>0?w.scrollY/max:0}catch(x){return 0}}
function restore(f,r){if(!r)return;var t0=Date.now();(function tryIt(){try{var w=f.contentWindow,d=w.document.documentElement;var max=d.scrollHeight-w.innerHeight;if(max>w.innerHeight||Date.now()-t0>2500){w.scrollTo(0,r*max);return}}catch(x){return}setTimeout(tryIt,120)})()}
var sync=false;
function hook(f,other){try{var w=f.contentWindow;
 w.addEventListener('hashchange',function(){var h=w.location.hash.slice(1);if(h&&h!==S.page&&PAGES.indexOf(h)>=0){S.page=h;$('vpage').value=h;writeHash();if(!$('vpb').hidden)load($(other),S.b,false)}});
 w.addEventListener('scroll',function(){if(sync||$('vpb').hidden)return;sync=true;var r=scrollRatio(f),o=$(other).contentWindow;try{var d=o.document.documentElement;o.scrollTo(0,r*(d.scrollHeight-o.innerHeight))}catch(x){}requestAnimationFrame(function(){sync=false})},{passive:true});
 w.document.addEventListener('keydown',keys);
}catch(x){}}
function keys(ev){var t=ev.target.tagName;if(t==='SELECT'||t==='INPUT'||t==='TEXTAREA'||ev.altKey||ev.ctrlKey||ev.metaKey)return;if(ev.key==='ArrowLeft'){flip(-1);ev.preventDefault()}else if(ev.key==='ArrowRight'){flip(1);ev.preventDefault()}}
function load(f,vid,keep){var v=ver(vid),r=keep?scrollRatio(f):0;var src=v.path+'#'+S.page;
 f.onload=function(){tidy(f);hook(f,f.id==='vfa'?'vfb':'vfa');restore(f,r)};
 if(f.getAttribute('src')===src)return;f.setAttribute('src',src)}
function label(v){return v.title+' · '+when(v.date)+(v.commit==='live'?'':' · '+v.commit)}
function show(keep){
 var a=ver(S.v);
 Array.prototype.forEach.call($('vtl').children,function(b){b.setAttribute('aria-current',b.dataset.id===a.id?'true':'false');b.classList.toggle('is-b',!!S.b&&b.dataset.id===S.b)});
 $('vnote').innerHTML=esc(a.note)+' <code>'+esc(a.commit==='live'?'live site':a.commit+' · '+a.subject)+'</code>';
 $('vopen').href=a.path+'#'+S.page;
 $('vlabA').textContent=label(a);
 $('vpb').hidden=!S.b;$('vcmp').setAttribute('aria-pressed',S.b?'true':'false');
 if(S.b)$('vlabB').textContent=label(ver(S.b))+' · click a checkpoint with Shift to change this side';
 $('vstage').classList.toggle('is-phone',S.w==='phone');
 $('vdesk').setAttribute('aria-pressed',S.w!=='phone'?'true':'false');$('vphone').setAttribute('aria-pressed',S.w==='phone'?'true':'false');
 load($('vfa'),S.v,keep);if(S.b)load($('vfb'),S.b,keep);
 writeHash();
}
function flip(d){var i=Math.max(0,Math.min(V.length-1,idx(S.v)+d));if(V[i].id!==S.v){S.v=V[i].id;show(true)}}

fetch('versions/versions.json').then(function(r){return r.json()}).then(function(d){V=d.versions;return fetch('content/pages.json')}).then(function(r){return r.json()}).then(function(d){
 var pages=d.pages||d;PAGES=pages.map(function(p){return p.id});
 $('vpage').innerHTML=pages.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.section+' · '+p.nav_label)+'</option>'}).join('');
 $('vtl').innerHTML=V.map(function(v,i){return '<button class="vh-v" data-id="'+esc(v.id)+'" title="'+esc(v.note)+'"><small>'+(i+1)+' · '+esc(when(v.date))+'</small><b>'+esc(v.title)+'</b></button>'}).join('');
 readHash();if(PAGES.indexOf(S.page)<0)S.page=PAGES[0];S.v=ver(S.v).id;if(S.b)S.b=ver(S.b).id;
 $('vpage').value=S.page;
 $('vtl').onclick=function(ev){var b=ev.target.closest('.vh-v');if(!b)return;if(ev.shiftKey&&S.b){S.b=b.dataset.id}else S.v=b.dataset.id;show(true)};
 $('vpage').onchange=function(){S.page=this.value;show(false)};
 $('vcmp').onclick=function(){S.b=S.b?null:(S.v==='now'?V[V.length-2].id:'now');show(true)};
 $('vdesk').onclick=function(){S.w='desk';show(true)};$('vphone').onclick=function(){S.w='phone';show(true)};
 document.addEventListener('keydown',keys);
 show(false);
}).catch(function(err){$('vnote').textContent='The checkpoints could not load: '+err.message});
})();
</script>
</body>
</html>
