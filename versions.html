<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page history</title>
<meta name="robots" content="noindex">
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@300;400;500&display=swap">
<link rel="stylesheet" href="design-system/tokens.css">
<style>
/* Page history viewer. Draft tooling, tokens only. */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--surface-sunken); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.vh-bar { background: var(--surface); border-bottom: 1px solid var(--line); padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-3); }
.vh-row { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.vh-title { font: 300 20px/26px var(--font-sans); margin: 0; }
.vh-title a { color: inherit; text-decoration: none; }
.vh-ctl { display: flex; gap: var(--space-2); align-items: center; font: 400 12px/18px var(--font-mono); color: var(--ink-muted); }
.vh-ctl select, .vh-btn { font: 400 13px/18px var(--font-mono); color: var(--ink); background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 6px 10px; min-height: 36px; }
.vh-ctl select { min-width: 0; max-width: 100%; }
.vh-btn { cursor: pointer; }
.vh-btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.vh-btn:disabled { opacity: 0.4; cursor: default; }
.vh-seg { gap: 0; }
.vh-seg .vh-btn { border-radius: 0; }
.vh-seg .vh-btn:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
.vh-seg .vh-btn:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; border-left-width: 0; }
.vh-sp { flex: 1; }
.vh-link { font: 400 12px/18px var(--font-mono); color: var(--flow); }
/* The main control: the big checkpoints (default) or every commit. */
.vh-nav { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-3); align-items: start; }
.vh-cps { position: relative; display: flex; overflow-x: auto; scrollbar-width: thin; padding-top: 2px; }
.vh-cp { flex: 1 0 112px; position: relative; display: grid; gap: 2px; align-content: start; justify-items: start; text-align: left; cursor: pointer; background: none; border: 0; padding: 0 var(--space-3) var(--space-1) 0; color: var(--ink-muted); font: inherit; }
.vh-cp::before { content: ""; position: absolute; left: 0; right: 0; top: 12px; border-top: 1px solid var(--line-strong); }
.vh-cp:first-child::before { left: 12px; }
.vh-cp:last-child::before { right: auto; width: 12px; }
.vh-n { position: relative; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 400 11px/1 var(--font-mono); }
.vh-cp.is-live .vh-n::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.vh-cp.is-page .vh-n::after, .vh-dot { content: ""; position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--flow); border: 1px solid var(--surface); }
.vh-cp b { font: 400 13px/18px var(--font-sans); color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vh-cp small { font: 400 11px/16px var(--font-mono); }
.vh-cp:hover .vh-n { border-color: var(--ink); }
.vh-cp[aria-current="true"] .vh-n { background: var(--flow); border-color: var(--flow); color: var(--surface); }
.vh-cp[aria-current="true"] b { font-weight: 500; }
.vh-cp.is-b .vh-n { outline: 1px dashed var(--ink-muted); outline-offset: 2px; }
.vh-cp.is-absent b, .vh-cp.is-absent .vh-n { opacity: 0.45; }
.vh-scrub { display: grid; gap: 2px; padding-top: var(--space-2); }
.vh-scrub input[type=range] { width: 100%; margin: 0; accent-color: var(--flow); }
.vh-ticks { position: relative; height: 6px; }
.vh-ticks i { position: absolute; top: 0; width: 1px; height: 6px; background: var(--line-strong); }
.vh-ticks i.is-page { background: var(--flow); width: 2px; }
.vh-ticks i.is-cp { background: var(--ink); width: 2px; }
.vh-meta { font: 400 13px/20px var(--font-sans); color: var(--ink-muted); margin: 0; }
.vh-meta code { font: 400 12px/18px var(--font-mono); color: var(--ink); }
.vh-tag { display: inline-block; font: 400 11px/16px var(--font-mono); padding: 0 6px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); color: var(--ink); margin-right: 4px; }
.vh-tag.is-on { border-color: var(--flow); color: var(--flow); }
.vh-stage { flex: 1; display: flex; gap: var(--space-2); padding: var(--space-2); min-height: 0; justify-content: center; }
.vh-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; max-width: 100%; }
.vh-pane > span { font: 400 11px/16px var(--font-mono); color: var(--ink-muted); padding: 0 0 var(--space-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vh-pane iframe { flex: 1; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); }
.is-phone .vh-pane { flex: 0 1 392px; }
.vh-keys { font: 400 11px/16px var(--font-mono); color: var(--ink-muted); display: flex; gap: var(--space-2); align-items: center; }
.vh-keys .vh-dot { position: relative; top: 0; right: 0; display: inline-block; }
@media (max-width: 760px) {
 .vh-bar { padding: var(--space-3); }
 .vh-keys, .vh-cmp { display: none; }
 .vh-cp { flex-basis: 100px; }
 .vh-stage { padding: 0; }
 .vh-pane iframe { border-radius: 0; border-width: 1px 0 0; }
}
</style>
</head>
<body>
<header class="vh-bar">
 <div class="vh-row">
  <h1 class="vh-title"><a href="index.html">Aquemi</a> · page history</h1>
  <label class="vh-ctl">Page <select id="vpage"></select></label>
  <span class="vh-ctl vh-seg" role="group" aria-label="Width">
   <button class="vh-btn" id="vdesk" aria-pressed="true">Desktop</button><button class="vh-btn" id="vphone" aria-pressed="false">Phone</button>
  </span>
  <span class="vh-ctl vh-cmp">
   <button class="vh-btn" id="vcmp" aria-pressed="false" title="Show a second version beside this one. Shift-click a checkpoint to put it on the right.">Compare</button>
   <label class="vh-ctl" id="vwithl" hidden>with <select id="vwith"></select></label>
  </span>
  <span class="vh-sp"></span>
  <a class="vh-link" id="vopen" href="index.html" target="_blank" rel="noopener">Open this version ↗</a>
 </div>
 <div class="vh-row">
  <span class="vh-ctl vh-seg" role="group" aria-label="Step through">
   <button class="vh-btn" id="vmcp" aria-pressed="true">Checkpoints</button><button class="vh-btn" id="vmall" aria-pressed="false">All versions</button>
  </span>
  <span class="vh-sp"></span>
  <span class="vh-keys"><i class="vh-dot"></i> this page's copy changed · ← → step</span>
 </div>
 <div class="vh-nav">
  <button class="vh-btn" id="vprev">←</button>
  <div>
   <nav class="vh-cps" id="vcps" aria-label="Big checkpoints"></nav>
   <div class="vh-scrub" id="vscrub" hidden>
    <input type="range" id="vrange" min="0" value="0" aria-label="Every commit on main">
    <div class="vh-ticks" id="vticks" aria-hidden="true"></div>
   </div>
  </div>
  <button class="vh-btn" id="vnext">→</button>
 </div>
 <div class="vh-row" id="vallrow" hidden>
  <label class="vh-ctl">Version <select id="vcommit"></select></label>
  <label class="vh-ctl"><input type="checkbox" id="vonly" checked> Step only through changes to this page</label>
 </div>
 <p class="vh-meta" id="vmeta"></p>
</header>
<main class="vh-stage" id="vstage">
 <div class="vh-pane"><span id="vlabA"></span><iframe id="vfa" title="Selected version"></iframe></div>
 <div class="vh-pane" id="vpb" hidden><span id="vlabB"></span><iframe id="vfb" title="Compared version"></iframe></div>
</main>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
// C: every commit oldest first, then the live site as 'now'. STOPS: indexes in C of the big checkpoints, then 'now'.
// S: what is on screen (kept in the hash); m is 'cp' to step through the checkpoints, 'all' to step through every commit.
var NOSW=false,C=[],STOPS=[],PAGES=[],S={page:'home',v:'now',b:null,w:'desk',only:'1',m:''};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function trim(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s}
function idx(id){for(var i=0;i<C.length;i++)if(C[i].c===id)return i;return C.length-1}
function day(d){return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function when(d){return day(d)+' '+new Date(d).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
// Without a service worker (some embedded or private browsers) old versions come straight from GitHub.
function src(i){return C[i].c==='now'?'index.html':NOSW?'https://raw.githack.com/Aquemi-Official/aquemi-web/'+C[i].h+'/index.html':'versions/at/'+C[i].c+'/index.html'}
function readHash(){location.hash.slice(1).split('&').forEach(function(kv){var p=kv.split('=');if(p[0]&&p[1]!==undefined)S[p[0]]=decodeURIComponent(p[1])});if(!S.b)S.b=null}
function writeHash(){var h='page='+S.page+'&v='+S.v+(S.b?'&b='+S.b:'')+(S.m==='all'?'&m=all':'')+(S.w==='phone'?'&w=phone':'')+(S.only==='0'?'&only=0':'');try{history.replaceState(null,'','#'+h)}catch(x){}}

// Checkpoints: stop k (0-based) ends a stretch of commits; a commit belongs to the first stop at or after it.
function stopNo(i){return STOPS.indexOf(i)}
function stretch(i){for(var k=0;k<STOPS.length;k++)if(STOPS[k]>=i)return k;return STOPS.length-1}
// What changed for this page from version a to version b: its copy, the shared design, or nothing.
function diff(a,b,page){if(a<0)return {copy:true,design:true};var x=C[a],y=C[b];
 return {copy:(x.pages||{})[page]!==(y.pages||{})[page],design:x.design!==y.design}}
function base(i){if(S.m==='all')return i-1;var k=stopNo(i);return k>0?STOPS[k-1]:-1}
function touches(i){var ch=diff(i-1,i,S.page);return ch.copy||ch.design}
function absent(i){var p=C[i].pages||{};return Object.keys(p).length>0&&p[S.page]===undefined}

// The frame's own draft bar is hidden: this bar does its job.
function tidy(f){try{var d=f.contentDocument;if(!d||d.getElementById('vh-tidy'))return;var s=d.createElement('style');s.id='vh-tidy';s.textContent='.draftbar{display:none!important}';(d.head||d.documentElement).appendChild(s)}catch(x){}}
function ratio(f){try{var w=f.contentWindow,d=w.document.documentElement,m=d.scrollHeight-w.innerHeight;return m>0?w.scrollY/m:0}catch(x){return 0}}
function restore(f,r){if(!r)return;var t0=Date.now();(function go(){try{var w=f.contentWindow,d=w.document.documentElement,m=d.scrollHeight-w.innerHeight;if(m>w.innerHeight||Date.now()-t0>2500){w.scrollTo(0,r*m);return}}catch(x){return}setTimeout(go,120)})()}
var syncing=false;
function hook(f,other){try{var w=f.contentWindow;
 w.addEventListener('hashchange',function(){var h=w.location.hash.slice(1);if(h&&h!==S.page&&PAGES.indexOf(h)>=0){S.page=h;$('vpage').value=h;show(false,true)}});
 w.addEventListener('scroll',function(){if(syncing||$('vpb').hidden)return;syncing=true;var r=ratio(f),o=$(other).contentWindow;try{var d=o.document.documentElement;o.scrollTo(0,r*(d.scrollHeight-o.innerHeight))}catch(x){}requestAnimationFrame(function(){syncing=false})},{passive:true});
 w.document.addEventListener('keydown',keys);
}catch(x){}}
function load(f,i,keep){var r=keep?ratio(f):0,u=src(i)+'#'+S.page;
 f.onload=function(){tidy(f);hook(f,f.id==='vfa'?'vfb':'vfa');restore(f,r)};
 if(f.getAttribute('src')!==u)f.setAttribute('src',u)}
function name(i){var c=C[i],k=stopNo(i);return c.c==='now'?'Now':c.title?(k+1)+' · '+c.title:c.subject}
function label(i){var c=C[i];return name(i)+' · '+when(c.date)+(c.c==='now'?' · live':' · '+c.c)}

function drawStops(){$('vcps').innerHTML=STOPS.map(function(i,k){var c=C[i],live=c.c==='now';
 return '<button class="vh-cp'+(live?' is-live':'')+'" data-i="'+i+'" title="'+esc(live?'The site as it is now':c.note||c.subject)+'"><span class="vh-n">'+(live?'':k+1)+'</span><b>'+esc(live?'Now':c.title)+'</b><small>'+(live?'live site':esc(day(c.date))+' · '+esc(c.c))+'</small></button>'}).join('')}
// Every version, grouped by the checkpoint each commit leads to.
function drawVersions(){var h='';STOPS.forEach(function(end,k){var start=k?STOPS[k-1]+1:0,c=C[end],live=c.c==='now';
 h+='<optgroup label="'+esc(live?(start<end?'After checkpoint '+k+', and the live site':'The live site'):(k+1)+' · '+c.title)+'">';
 for(var i=start;i<=end;i++){var x=C[i];h+='<option value="'+esc(x.c)+'">'+esc(x.c==='now'?'Now · the live site':x.c+' · '+when(x.date)+' · '+trim(x.subject,80))+'</option>'}
 h+='</optgroup>'});$('vcommit').innerHTML=h}
function drawWith(){var bi=idx(S.b),o=STOPS.map(function(i){return '<option value="'+esc(C[i].c)+'">'+esc(name(i))+'</option>'});
 if(stopNo(bi)<0)o.push('<option value="'+esc(C[bi].c)+'">'+esc(C[bi].c+' · '+trim(C[bi].subject,48))+'</option>');
 $('vwith').innerHTML=o.join('');$('vwith').value=C[bi].c}
function ticks(){var n=C.length-1;$('vticks').innerHTML=C.map(function(c,i){var cls=c.title?'is-cp':(diff(i-1,i,S.page).copy?'is-page':'');return cls?'<i class="'+cls+'" style="left:calc('+(n?i/n*100:0)+'% - 1px)"></i>':''}).join('')}

function meta(i){var c=C[i],all=S.m==='all',k=stopNo(i),b=base(i),ch=diff(b,i,S.page),cps=STOPS.length-1,t;
 t=absent(i)?'<span class="vh-tag">page not in this version</span>':
  '<span class="vh-tag'+(ch.copy?' is-on':'')+'">'+(ch.copy?'copy changed':'copy same')+'</span><span class="vh-tag'+(ch.design?' is-on':'')+'">'+(ch.design?'design changed':'design same')+'</span>'+
  (b<0?'first version':all?'since the previous commit':'since checkpoint '+k)+' · ';
 if(!all&&c.c==='now'){var n=C.length-2-(k?STOPS[k-1]:-1);t+='the site as it is now'+(n>0?' · '+n+' commit'+(n>1?'s':'')+' after checkpoint '+k:'')}
 else if(!all)t+='checkpoint '+(k+1)+' of '+cps+' · '+esc(when(c.date))+' · <code>'+esc(c.c)+'</code> · '+(function(n){return n+' commit'+(n>1?'s':'')})(STOPS[k]-(k?STOPS[k-1]:-1))+' in this stretch';
 else{var s=stretch(i),end=STOPS[s],start=s?STOPS[s-1]+1:0;
  t+='version '+(i+1)+' of '+C.length+' · '+esc(when(c.date))+(c.author?' · '+esc(c.author):'')+' · <code>'+esc(c.c==='now'?'live site':c.c)+'</code> '+esc(c.subject)+
   (C[end].c==='now'?(s&&c.c!=='now'?' · after checkpoint '+s:''):end===i?' · checkpoint '+(s+1):' · on the way to checkpoint '+(s+1)+', '+esc(C[end].title)+' ('+(i-start+1)+' of '+(end-start+1)+')')}
 return t+(c.note?'<br>'+esc(c.note):'')+(NOSW?'<br>This browser does not allow the history service worker, so old versions load from GitHub through raw.githack.com.':'')}

function show(keep,fromFrame){
 var i=idx(S.v),all=S.m==='all',bi=S.b?idx(S.b):-1,box=$('vcps'),cur=null;
 $('vmcp').setAttribute('aria-pressed',all?'false':'true');$('vmall').setAttribute('aria-pressed',all?'true':'false');
 box.hidden=all;$('vscrub').hidden=!all;$('vallrow').hidden=!all;
 $('vprev').setAttribute('aria-label',all?'Previous version':'Previous checkpoint');$('vnext').setAttribute('aria-label',all?'Next version':'Next checkpoint');
 Array.prototype.forEach.call(box.children,function(el,k){var j=+el.dataset.i;if(j===i)cur=el;
  el.setAttribute('aria-current',j===i?'true':'false');
  el.classList.toggle('is-page',k>0&&diff(STOPS[k-1],j,S.page).copy);
  el.classList.toggle('is-absent',absent(j));el.classList.toggle('is-b',j===bi)});
 if(cur&&!all){var L=cur.offsetLeft,R=L+cur.offsetWidth;if(L<box.scrollLeft)box.scrollLeft=L;else if(R>box.scrollLeft+box.clientWidth)box.scrollLeft=R-box.clientWidth}
 $('vrange').value=i;$('vcommit').value=C[i].c;
 $('vmeta').innerHTML=meta(i);
 $('vopen').href=src(i)+'#'+S.page;
 $('vlabA').textContent=label(i);
 $('vpb').hidden=!S.b;$('vwithl').hidden=!S.b;$('vcmp').setAttribute('aria-pressed',S.b?'true':'false');
 if(S.b){$('vlabB').textContent=label(bi);drawWith()}
 $('vstage').classList.toggle('is-phone',S.w==='phone');
 $('vdesk').setAttribute('aria-pressed',S.w!=='phone'?'true':'false');$('vphone').setAttribute('aria-pressed',S.w==='phone'?'true':'false');
 $('vonly').checked=S.only!=='0';
 $('vprev').disabled=next(-1)===i;$('vnext').disabled=next(1)===i;
 if(all)ticks();
 if(!fromFrame)load($('vfa'),i,keep);
 if(S.b)load($('vfb'),bi,keep);
 writeHash();
}
function next(d){var i=idx(S.v),j;
 if(S.m!=='all'){var k=stopNo(i);j=(k<0?stretch(i):k)+d;return j>=0&&j<STOPS.length?STOPS[j]:i}
 j=i+d;while(j>=0&&j<C.length){if(S.only==='0'||C[j].c==='now'||C[j].title||touches(j))return j;j+=d}return i}
function step(d){var j=next(d);if(j!==idx(S.v)){S.v=C[j].c;show(true)}}
// Checkpoints mode only ever shows a checkpoint: a commit in between snaps to the checkpoint its stretch leads to.
function mode(m){S.m=m;var i=idx(S.v);if(m==='cp'&&stopNo(i)<0)S.v=C[STOPS[stretch(i)]].c;show(true)}
function keys(ev){var t=ev.target.tagName;if(t==='SELECT'||t==='INPUT'||t==='TEXTAREA'||ev.altKey||ev.ctrlKey||ev.metaKey)return;if(ev.key==='ArrowLeft'){step(-1);ev.preventDefault()}else if(ev.key==='ArrowRight'){step(1);ev.preventDefault()}}

function start(){
 Promise.all([fetch('versions/index.json',{cache:'no-cache'}).then(function(r){return r.json()}),fetch('content/pages.json',{cache:'no-cache'}).then(function(r){return r.json()})]).then(function(d){
  C=d[0].commits;var last=C[C.length-1];
  C.push({c:'now',date:new Date().toISOString(),author:'',subject:'The site as it is now',title:null,design:last.design,pages:last.pages});
  var pages=d[1].pages||d[1],L=d[0].labels||{},live={};
  pages.forEach(function(p){live[p.id]=1;L[p.id]=p.section+' · '+p.nav_label});
  // the live site may be ahead of the last stored commit
  C[C.length-1].pages={};pages.forEach(function(p){C[C.length-1].pages[p.id]=(last.pages||{})[p.id]});
  // every page that ever existed: live ones first, then retired ones (they open in the versions that had them)
  PAGES=pages.map(function(p){return p.id});var gone=Object.keys(L).filter(function(id){return !live[id]});
  $('vpage').innerHTML=PAGES.map(function(id){return '<option value="'+esc(id)+'">'+esc(L[id])+'</option>'}).join('')+
   (gone.length?'<optgroup label="Retired pages">'+gone.map(function(id){return '<option value="'+esc(id)+'">'+esc(L[id])+'</option>'}).join('')+'</optgroup>':'');
  PAGES=PAGES.concat(gone);
  STOPS=[];C.forEach(function(c,i){if(c.title)STOPS.push(i)});STOPS.push(C.length-1);
  $('vmcp').textContent='Checkpoints ('+(STOPS.length-1)+')';$('vmall').textContent='All versions ('+C.length+')';
  drawStops();drawVersions();
  $('vrange').max=C.length-1;
  readHash();if(PAGES.indexOf(S.page)<0)S.page=PAGES[0];S.v=C[idx(S.v)].c;if(S.b)S.b=C[idx(S.b)].c;
  // a link to a commit between checkpoints opens in "All versions"
  if(S.m!=='all'&&S.m!=='cp')S.m=stopNo(idx(S.v))<0?'all':'cp';if(S.m==='cp'&&stopNo(idx(S.v))<0)S.v=C[STOPS[stretch(idx(S.v))]].c;
  $('vpage').value=S.page;
  $('vcps').onclick=function(ev){var b=ev.target.closest('.vh-cp');if(!b)return;var c=C[+b.dataset.i].c;if(ev.shiftKey&&S.b)S.b=c;else S.v=c;show(true)};
  $('vrange').oninput=function(){S.v=C[+this.value].c;show(true)};
  $('vcommit').onchange=function(){S.v=this.value;show(true)};
  $('vprev').onclick=function(){step(-1)};$('vnext').onclick=function(){step(1)};
  $('vmcp').onclick=function(){mode('cp')};$('vmall').onclick=function(){mode('all')};
  $('vonly').onchange=function(){S.only=this.checked?'1':'0';show(true)};
  $('vpage').onchange=function(){S.page=this.value;show(false)};
  $('vcmp').onclick=function(){S.b=S.b?null:S.v!=='now'?'now':C[STOPS[Math.max(0,STOPS.length-2)]].c;show(true)};
  $('vwith').onchange=function(){S.b=this.value;show(true)};
  $('vdesk').onclick=function(){S.w='desk';show(true)};$('vphone').onclick=function(){S.w='phone';show(true)};
  document.addEventListener('keydown',keys);
